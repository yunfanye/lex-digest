formatVersion: 1
id: lex-digest
name: Lex Digest
version: 0.1.0
description: Subscribes to the Lex Fridman Podcast RSS feed, checks for new episodes, and produces transcript-based summaries, key takeaways, and highlights.
icon: assets/icon.svg
appRoot: dist

web:
  manifest: web/manifest.json
  displayName: Lex Digest
  navLabel: Lex Digest

api:
  entry: api/index

db:
  migrations: db/migrations
  tablePrefix: lex_digest

actions:
  - actions/check-feed
  - actions/summarize-episode

agents:
  - agents/digester.yaml
