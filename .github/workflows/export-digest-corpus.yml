name: Export digest repository

on:
  pull_request:
    branches: [master]
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package repository
        run: |
          tar --exclude=.git -czf /tmp/lex-digest-repository.tar.gz .

      - name: Upload repository
        uses: actions/upload-artifact@v4
        with:
          name: lex-digest-repository
          path: /tmp/lex-digest-repository.tar.gz
          retention-days: 1
          compression-level: 0
