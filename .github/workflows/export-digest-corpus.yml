name: Export digest corpus

on:
  pull_request:
    branches: [master]
    types: [opened]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package corpus
        run: |
          tar -czf lex-digest-corpus.tar.gz \
            data/transcripts \
            data/digests \
            data/manifest.json \
            docs/CONTENT.md \
            scripts/sync_digests.mjs \
            src/agents/digester.yaml

      - name: Upload corpus
        uses: actions/upload-artifact@v4
        with:
          name: lex-digest-corpus
          path: lex-digest-corpus.tar.gz
          retention-days: 1
          compression-level: 0
