name: Export WordPress GUID map 1-99

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch WordPress post IDs
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          entries = json.loads(Path('data/manifest.json').read_text())
          output = {}
          missing = []
          headers = {'User-Agent': 'Mozilla/5.0 lex-digest-maintenance'}
          patterns = [
              re.compile(r'<link[^>]+rel=["\']shortlink["\'][^>]+href=["\']https://lexfridman\.com/\?p=(\d+)["\']', re.I),
              re.compile(r'<link[^>]+href=["\']https://lexfridman\.com/\?p=(\d+)["\'][^>]+rel=["\']shortlink["\']', re.I),
              re.compile(r'\bpostid-(\d+)\b', re.I),
          ]
          for entry in entries:
              episode = int(entry['episode'])
              if not 1 <= episode <= 99:
                  continue
              url = entry['episode_url']
              urls = [url]
              if not url.endswith('/'):
                  urls.append(url + '/')
              html = None
              for candidate in urls:
                  try:
                      request = urllib.request.Request(candidate, headers=headers)
                      with urllib.request.urlopen(request, timeout=45) as response:
                          html = response.read().decode('utf-8', errors='replace')
                      break
                  except urllib.error.HTTPError as exc:
                      if exc.code != 404:
                          raise
              if html is None:
                  missing.append(episode)
                  print('MISSING', episode, url)
                  continue
              post_id = None
              for pattern in patterns:
                  match = pattern.search(html)
                  if match:
                      post_id = match.group(1)
                      break
              if not post_id:
                  missing.append(episode)
                  print('NO_ID', episode, url)
                  continue
              output[str(episode)] = f'https://lexfridman.com/?p={post_id}'
              print(episode, output[str(episode)])
              time.sleep(0.12)
          Path('wordpress-guids-1-99.json').write_text(json.dumps({'guids': output, 'missing': missing}, indent=2, sort_keys=True) + '\n')
          print('MISSING_EPISODES', missing)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wordpress-guids-1-99
          path: wordpress-guids-1-99.json
          retention-days: 1
