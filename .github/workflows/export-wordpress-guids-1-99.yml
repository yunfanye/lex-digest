name: Resolve legacy WordPress GUIDs 84 and 98

on:
  pull_request:
    branches: [master]
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Query WordPress REST API
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          headers = {'User-Agent': 'Mozilla/5.0 lex-digest-maintenance'}
          out = {}
          for ep, guest in [(84, 'William MacAskill'), (98, 'Kate Darling')]:
              for endpoint in ['posts', 'pages']:
                  q = urllib.parse.urlencode({'search': guest, 'per_page': 100, 'status': 'publish'})
                  url = f'https://lexfridman.com/wp-json/wp/v2/{endpoint}?{q}'
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=45) as r:
                      rows = json.loads(r.read().decode())
                  print('QUERY', ep, endpoint, json.dumps([{'id': x.get('id'), 'link': x.get('link'), 'title': x.get('title',{}).get('rendered')} for x in rows], ensure_ascii=False))
                  if rows and str(ep) not in out:
                      for x in rows:
                          title = x.get('title', {}).get('rendered', '')
                          if guest.lower() in title.lower():
                              out[str(ep)] = f"https://lexfridman.com/?p={x['id']}"
                              break
          print('RESOLVED', json.dumps(out, sort_keys=True))
          open('legacy-guids.json','w').write(json.dumps(out, indent=2, sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-guids-84-98
          path: legacy-guids.json
          retention-days: 1
