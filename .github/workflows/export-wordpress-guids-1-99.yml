name: Verify legacy WordPress GUID gaps

on:
  pull_request:
    branches: [master]
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe neighboring post IDs
        run: |
          python - <<'PY'
          import html, re, urllib.error, urllib.request
          headers = {'User-Agent': 'Mozilla/5.0 lex-digest-maintenance'}
          for pid in list(range(4191,4196)) + list(range(4245,4251)):
              url=f'https://lexfridman.com/?p={pid}'
              try:
                  req=urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=45) as r:
                      body=r.read().decode('utf-8',errors='replace')
                      final=r.geturl()
                  m=re.search(r'<title>(.*?)</title>',body,re.I|re.S)
                  title=html.unescape(re.sub(r'\s+',' ',m.group(1)).strip()) if m else ''
                  print(pid, 'FINAL', final, 'TITLE', title)
              except urllib.error.HTTPError as e:
                  print(pid, 'HTTP', e.code)
          PY
