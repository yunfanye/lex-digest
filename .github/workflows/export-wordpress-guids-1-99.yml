name: Recover legacy GUIDs from podcast feed

on:
  pull_request:
    branches: [master]
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect RSS items
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          headers = {'User-Agent': 'Mozilla/5.0 lex-digest-maintenance'}
          req = urllib.request.Request('https://lexfridman.com/feed/podcast/', headers=headers)
          with urllib.request.urlopen(req, timeout=45) as r:
              xml = r.read()
          root = ET.fromstring(xml)
          for item in root.findall('.//item'):
              title = item.findtext('title') or ''
              if 'William MacAskill' in title or 'Kate Darling' in title:
                  print('TITLE', title)
                  print('GUID', item.findtext('guid'))
                  print('LINK', item.findtext('link'))
                  print('DATE', item.findtext('pubDate'))
          PY
