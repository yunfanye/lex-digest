name: Export transcript selections 200-249

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/digests-1-500
          fetch-depth: 1

      - name: Generate deterministic transcript selections
        shell: bash
        run: |
          set -euo pipefail
          python .digest-build/generate_all_digests.py
          mkdir selected-digests-200-249
          for episode in $(seq 200 249); do
            files=(data/digests/${episode}-*.md)
            test "${#files[@]}" -eq 1
            cp "${files[0]}" selected-digests-200-249/
          done
          test "$(find selected-digests-200-249 -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 50
          tar -czf selected-digests-200-249.tar.gz selected-digests-200-249
          sha256sum selected-digests-200-249.tar.gz > selected-digests-200-249.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: selected-digests-200-249
          path: |
            selected-digests-200-249.tar.gz
            selected-digests-200-249.tar.gz.sha256
          retention-days: 1
