name: Export digest sources 200-249

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/digests-200-299

      - name: Package transcripts, metadata, official pages, and draft bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil
          import time
          import urllib.request

          root = Path('digest-sources-200-249')
          transcripts_out = root / 'transcripts'
          pages_out = root / 'official-pages'
          draft_out = root / 'draft-bundle'
          transcripts_out.mkdir(parents=True, exist_ok=True)
          pages_out.mkdir(parents=True, exist_ok=True)
          draft_out.mkdir(parents=True, exist_ok=True)

          entries = json.loads(Path('data/manifest.json').read_text(encoding='utf-8'))
          selected = [entry for entry in entries if 200 <= int(entry['episode']) <= 249]
          if len(selected) != 50:
              raise SystemExit(f'expected 50 manifest entries, got {len(selected)}')

          headers = {'User-Agent': 'Mozilla/5.0 lex-digest-maintenance'}
          guids = {}
          for entry in selected:
              episode = int(entry['episode'])
              src = Path('data/transcripts') / entry['file']
              if not src.exists():
                  raise SystemExit(f'missing transcript: {src}')
              shutil.copy2(src, transcripts_out / src.name)

              request = urllib.request.Request(entry['episode_url'], headers=headers)
              with urllib.request.urlopen(request, timeout=45) as response:
                  page = response.read()
              (pages_out / f'{episode}.html').write_bytes(page)
              text = page.decode('utf-8', errors='replace')
              post_id = None
              for pattern in (
                  re.compile(r'https://lexfridman\.com/\?p=(\d+)', re.I),
                  re.compile(r'postid-(\d+)', re.I),
              ):
                  match = pattern.search(text)
                  if match:
                      post_id = match.group(1)
                      break
              if not post_id:
                  raise SystemExit(f'could not find WordPress post ID for episode {episode}')
              guids[str(episode)] = f'https://lexfridman.com/?p={post_id}'
              print(episode, guids[str(episode)])
              time.sleep(0.12)

          (root / 'manifest-200-249.json').write_text(
              json.dumps(selected, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          (root / 'wordpress-guids-200-249.json').write_text(
              json.dumps(guids, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (root / 'no-ai-slop-SKILLS.md').write_text(
              Path('data/digests/skills/no-ai-slop/SKILLS.md').read_text(encoding='utf-8'),
              encoding='utf-8',
          )
          for part in sorted(Path('.digest-build').glob('digests-200-299.part*.b64')):
              shutil.copy2(part, draft_out / part.name)
          PY
          tar -czf digest-sources-200-249.tar.gz digest-sources-200-249
          sha256sum digest-sources-200-249.tar.gz > digest-sources-200-249.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: digest-sources-200-249
          path: |
            digest-sources-200-249.tar.gz
            digest-sources-200-249.tar.gz.sha256
          retention-days: 1
