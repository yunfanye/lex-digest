name: Materialize digests 200-299

on:
  push:
    branches: [agent/digests-200-299]
    paths: [.github/workflows/materialize-digests-200-299.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/digests-200-299
          fetch-depth: 0

      - name: Decode and verify digest archive
        shell: bash
        run: |
          set -euo pipefail
          cat .digest-build/digests-200-299.part*.b64 > /tmp/digests-200-299.b64
          base64 --decode /tmp/digests-200-299.b64 > /tmp/digests-200-299.tar.bz2
          echo '8706efa9bd13cfe7319d4f7efb07b9619a419b500fa3fc33e1cafabeb0702ead  /tmp/digests-200-299.tar.bz2' | sha256sum --check --strict
          test "$(tar -tjf /tmp/digests-200-299.tar.bz2 | wc -l)" -eq 100

      - name: Install and validate digests
        shell: bash
        run: |
          set -euo pipefail
          tar -xjf /tmp/digests-200-299.tar.bz2 -C data/digests
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('data/digests')
          files = []
          for episode in range(200, 300):
              matches = list(root.glob(f'{episode}-*.md'))
              if len(matches) != 1:
                  raise SystemExit(f'episode {episode}: expected one digest, got {len(matches)}')
              files.append(matches[0])

          required = ['## One-liner', '## Summary', '## Takeaways', '## Highlights', '## Chapters']
          for path in files:
              text = path.read_text(encoding='utf-8')
              episode = int(path.name.split('-', 1)[0])
              if f'episode: {episode}' not in text:
                  raise SystemExit(f'{path}: episode frontmatter mismatch')
              if 'summary_source: transcript' not in text:
                  raise SystemExit(f'{path}: missing transcript source marker')
              if not re.search(r'^guid: https://lexfridman\.com/\?p=\d+$', text, re.M):
                  raise SystemExit(f'{path}: invalid GUID')
              for heading in required:
                  if heading not in text:
                      raise SystemExit(f'{path}: missing {heading}')
              if text.count('## Conversation @ (') != 6:
                  raise SystemExit(f'{path}: expected six transcript highlights')
              if text.count('- **[') != 6:
                  raise SystemExit(f'{path}: expected six takeaways')
          print(f'validated {len(files)} digests')
          PY

      - name: Remove transfer machinery and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .digest-build/digests-200-299.part*.b64
          rm -f .digest-build/materialize.trigger
          rm -f .github/workflows/export-wordpress-guids-200-299.yml
          rm -f .github/workflows/materialize-digests-200-299.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/digests .digest-build .github/workflows
          git commit -m 'Add transcript-grounded digests for episodes 200-299'
          git push origin HEAD:agent/digests-200-299
