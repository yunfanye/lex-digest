name: Materialize requested digests 200-249

on:
  push:
    branches: [agent/digests-200-299]
    paths: [.github/workflows/materialize-digests-200-299.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/digests-200-299
          fetch-depth: 0

      - name: Decode and verify digest archive
        shell: bash
        run: |
          set -euo pipefail
          cat .digest-build/digests-200-299.part*.b64 > /tmp/digests-200-299.b64
          base64 --decode /tmp/digests-200-299.b64 > /tmp/digests-200-299.tar.bz2
          echo '8706efa9bd13cfe7319d4f7efb07b9619a419b500fa3fc33e1cafabeb0702ead  /tmp/digests-200-299.tar.bz2' | sha256sum --check --strict
          test "$(tar -tjf /tmp/digests-200-299.tar.bz2 | wc -l)" -eq 100
          mkdir -p /tmp/digests-all
          tar -xjf /tmp/digests-200-299.tar.bz2 -C /tmp/digests-all

      - name: Build a clean 200-249 commit on current master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git reset --hard origin/master
          mkdir -p data/digests
          for episode in $(seq 200 249); do
            files=(/tmp/digests-all/${episode}-*.md)
            test "${#files[@]}" -eq 1
            cp "${files[0]}" data/digests/
          done

          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('data/digests')
          files = []
          for episode in range(200, 250):
              matches = list(root.glob(f'{episode}-*.md'))
              if len(matches) != 1:
                  raise SystemExit(f'episode {episode}: expected one digest, got {len(matches)}')
              files.append(matches[0])

          required = ['One-liner', 'Summary', 'Takeaways', 'Highlights', 'Chapters']
          for path in files:
              text = path.read_text(encoding='utf-8')
              episode = int(path.name.split('-', 1)[0])
              if not re.search(rf'^episode:\s*{episode}\s*$', text, re.M):
                  raise SystemExit(f'{path}: episode frontmatter mismatch')
              if not re.search(r'^summary_source:\s*["\']?transcript["\']?\s*$', text, re.M):
                  raise SystemExit(f'{path}: missing transcript source marker')
              if not re.search(r'^guid:\s*["\']?https://lexfridman\.com/\?p=\d+["\']?\s*$', text, re.M):
                  raise SystemExit(f'{path}: invalid GUID')
              for heading in required:
                  if not re.search(rf'^#{{1,2}} {re.escape(heading)}\s*$', text, re.M):
                      raise SystemExit(f'{path}: missing {heading}')
              if text.count('## Conversation @ (') != 6:
                  raise SystemExit(f'{path}: expected six transcript highlights')
          print(f'validated {len(files)} requested digests')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/digests
          git commit -m 'Add transcript-grounded digests for episodes 200-249'
          git push --force-with-lease origin HEAD:agent/digests-200-299
