name: Extract digest profiles 100-199

on:
  push:
    branches: [agent/digests-100-199]
    paths: [.github/workflows/extract-digest-profiles-100-199.yml]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/digests-100-199
          fetch-depth: 0
      - name: Extract compact transcript profiles
        run: python .digest-build/extract_profiles_100_199.py
      - name: Commit profiles and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/extract-digest-profiles-100-199.yml
          rm -f .digest-build/extract_profiles_100_199.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .digest-build .github/workflows
          git commit -m 'Extract transcript profiles for episodes 100-199'
          git push origin HEAD:agent/digests-100-199
