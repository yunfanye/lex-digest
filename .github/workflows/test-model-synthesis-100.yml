name: Test model synthesis 100

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  models: read

jobs:
  test:
    if: github.head_ref == 'agent/digests-100-199'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/digests-100-199
          fetch-depth: 0
      - name: Synthesize episode 100
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .digest-build/test_model_100.py
      - name: Commit test output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .digest-build/model-test-100.json
          git commit -m 'Record episode 100 synthesis quality test'
          git push origin HEAD:agent/digests-100-199
