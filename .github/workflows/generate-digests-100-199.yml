name: Generate digests 100-199

on:
  push:
    branches: [agent/digests-100-199]
    paths: [.github/workflows/generate-digests-100-199.yml]

concurrency:
  group: digests-100-199-generation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/digests-100-199
          fetch-depth: 0
      - name: Generate transcript-grounded digests
        shell: bash
        run: |
          set +e
          python .digest-build/generate_digests_100_199.py > .digest-build/generation.log 2>&1
          status=$?
          cat .digest-build/generation.log
          if [ "$status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            mv .digest-build/generation.log .digest-build/generation-error.log
            git add .digest-build/generation-error.log
            git commit -m 'Record digest generation failure'
            git push origin HEAD:agent/digests-100-199
            exit "$status"
          fi
      - name: Remove temporary build inputs
        shell: bash
        run: |
          rm -rf .digest-build/profiles-100-199
          rm -f .digest-build/generate_digests_100_199.py
          rm -f .digest-build/generation.log
          rm -f .github/workflows/generate-digests-100-199.yml
      - name: Commit digests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/digests .digest-build .github/workflows
          git commit -m 'Add transcript-grounded digests for episodes 100-199'
          git push origin HEAD:agent/digests-100-199
