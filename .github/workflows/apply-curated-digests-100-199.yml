name: Apply curated digests 100-199

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

concurrency:
  group: curated-digests-100-199
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rewrite:
    if: github.head_ref == 'agent/digests-100-199'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/digests-100-199
          fetch-depth: 0
      - name: Apply small build-time fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.digest-build/apply_curated_100_199.py')
          s=p.read_text()
          s=s.replace('match_takeaway(q,curated)', 'match_takeaway(q,curated["takes"])')
          p.write_text(s)
          p=Path('.digest-build/curated-100-149.json')
          s=p.read_text().replace('leverage, timing, position, and control', 'mechanical advantage, timing, position, and control')
          p.write_text(s)
          PY
      - name: Apply editorial rewrite and validations
        run: python .digest-build/apply_curated_100_199.py
      - name: Remove temporary build files
        run: |
          rm -f .digest-build/curated-100-149.json
          rm -f .digest-build/curated-150-199.json
          rm -f .digest-build/apply_curated_100_199.py
          rm -f .digest-build/test_model_100.py
          rm -f .digest-build/model-test-100.json
          rm -f .github/workflows/test-model-synthesis-100.yml
          rm -f .github/workflows/apply-curated-digests-100-199.yml
      - name: Commit curated digests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish episode 100-199 digests with transcript-specific synthesis'
          git push origin HEAD:agent/digests-100-199
