title: Lex Digest
description: Transcript-based summaries, key takeaways, and highlight quotes for every new Lex Fridman Podcast episode.
long_description: |
  Lex Digest subscribes to the Lex Fridman Podcast and checks for new episodes
  every two hours. When one drops, it reads the full timestamped transcript and
  writes a structured digest: a one-line verdict, a concise multi-paragraph
  summary, the key takeaways, and the most memorable verbatim quotes — each
  linked to the exact moment on YouTube.

  Browse the archive as a clean episode list, open any episode for its digest
  and chapter map, and jump straight to the parts worth hearing in full.
categories:
